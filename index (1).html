<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jisa Schedule</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&family=Zen+Kaku+Gothic+New:wght@300;400;500&display=swap">
<style>
  /* Layout: two analogue dials on top, one week of paper below. In Merged view a single week carries both countries' hours on its left and right edges. */
  :root{
    --paper:#f6f5f1; --surface:#fbfaf7; --ink:#1b1c1f; --mute:#8a877f; --line:#dedbd3;
    --shu:#c0402f;   /* 朱 vermilion: Vietnam */
    --ai:#2f4f7f;    /* 藍 indigo: Sweden */
    --night:rgba(27,28,31,.045);
    --serif:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",Georgia,serif;
    --sans:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#151618; --surface:#1b1c1f; --ink:#ebe9e3; --mute:#8d8b85; --line:#2d2e32;
      --shu:#e0705f; --ai:#86a5d8; --night:rgba(255,255,255,.04); color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --paper:#151618; --surface:#1b1c1f; --ink:#ebe9e3; --mute:#8d8b85; --line:#2d2e32;
    --shu:#e0705f; --ai:#86a5d8; --night:rgba(255,255,255,.04); color-scheme:dark;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--paper);color:var(--ink);font:300 15px/1.6 var(--sans);
    padding-block:48px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .page{max-width:1040px;margin:0 auto}
  .vn{--c:var(--shu)} .se{--c:var(--ai)}
  .head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-bottom:28px;border-bottom:1px solid var(--line)}
  h1{margin:0;font:400 44px/1 var(--serif);letter-spacing:.2em}
  .en{margin:10px 0 0;color:var(--mute);font-size:13px;letter-spacing:.08em}
  .diff{font:400 15px var(--serif);color:var(--mute);letter-spacing:.1em;white-space:nowrap}
  .diff b{font:400 44px/1 var(--serif);color:var(--ink);margin-right:6px;font-variant-numeric:tabular-nums}

  /* analogue clocks */
  .clocks{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
  .clock{display:flex;align-items:center;gap:24px;padding:30px 0;min-width:0}
  .clock + .clock{padding-left:32px;border-left:1px solid var(--line)}
  .dial{width:176px;height:176px;flex:none;display:block}
  .dial .ring{fill:none;stroke:var(--line);stroke-width:1}
  .dial .face{fill:var(--paper)}
  .dial.night .face{fill:color-mix(in srgb,var(--ink) 6%,var(--paper))}
  .dial .tm{stroke:var(--mute);stroke-width:.6}
  .dial .th{stroke:var(--ink);stroke-width:1.2}
  .dial text{font-family:var(--serif);fill:var(--mute);text-anchor:middle;dominant-baseline:central}
  .dial .hh{stroke:var(--ink);stroke-width:3.2;stroke-linecap:round}
  .dial .mm{stroke:var(--ink);stroke-width:1.8;stroke-linecap:round}
  .dial .ss{stroke:var(--c);stroke-width:1;stroke-linecap:round}
  .dial .hub{fill:var(--ink)} .dial .hub2{fill:var(--c)}
  .dial .arc{fill:none;stroke:var(--c);stroke-width:5;opacity:.85}
  .ctext{min-width:0}
  .label{font-size:12px;letter-spacing:.14em;color:var(--mute);display:flex;align-items:center;gap:8px}
  .label i{width:7px;height:7px;border-radius:50%;background:var(--c);display:inline-block;flex:none}
  .dtime{font:400 34px/1.15 var(--serif);margin:8px 0 2px;font-variant-numeric:tabular-nums;letter-spacing:.03em}
  .date{color:var(--mute);font-size:13px;letter-spacing:.06em}

  .tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px 28px;padding:24px 0 22px}
  .grp{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .tools .sp{flex:1}
  .mini{font-size:12px;color:var(--mute);letter-spacing:.1em}
  button,input{font:inherit;color:inherit}
  button{background:none;border:0;border-bottom:1px solid transparent;padding:3px 0;cursor:pointer;font-size:13px;letter-spacing:.08em;color:var(--mute)}
  button:hover{color:var(--ink);border-bottom-color:var(--ink)}
  button.on{color:var(--ink);border-bottom-color:var(--ink)}
  button:focus-visible,input:focus-visible,.ev:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  button.solid{background:var(--ink);color:var(--paper);padding:7px 16px;border-radius:2px;border:0}
  button.solid:hover{opacity:.85;color:var(--paper)}
  input[type=date],input[type=time],input[type=text]{background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:5px 2px;min-width:0}
  input[type=date]:focus,input[type=time]:focus,input[type=text]:focus{border-bottom-color:var(--ink);outline:0}
  #day{font-size:14px}

  /* calendar */
  .cal-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px 24px;flex-wrap:wrap;margin:6px 0 14px}
  .cal-head h2{margin:0;font:400 20px var(--serif);letter-spacing:.08em}
  .cal-head h2 span{color:var(--mute);font-size:14px;margin-left:10px;letter-spacing:.06em}
  .legend{display:flex;gap:18px;font-size:12px;color:var(--mute);letter-spacing:.08em;flex-wrap:wrap}
  .legend span{display:flex;align-items:center;gap:7px}
  .legend i{width:7px;height:7px;border-radius:50%;background:var(--c)}
  .scroller{overflow-x:auto;padding-bottom:4px}
  .zonetitle{margin:26px 0 12px}
  .wk{min-width:720px;margin-bottom:8px}
  .wkhead,.wkbody{display:grid;grid-template-columns:var(--cols)}
  .tag{font-size:11px;letter-spacing:.12em;color:var(--c);align-self:end;padding-bottom:10px}
  .tag.r{text-align:right}
  .dh{padding:0 8px 10px;display:flex;align-items:baseline;gap:8px;white-space:nowrap}
  .dh span{font-size:11.5px;color:var(--mute);letter-spacing:.06em}
  .dh b{font:400 22px/1 var(--serif);font-variant-numeric:tabular-nums}
  .dh.today b{border-bottom:2px solid var(--ink);padding-bottom:2px}
  .axis{position:relative}
  .axis span{position:absolute;font-size:10.5px;line-height:12px;color:var(--c);font-variant-numeric:tabular-nums;letter-spacing:.03em;opacity:.9}
  .axis.l span{right:8px;text-align:right}
  .axis.r span{left:8px}
  .axis sup{font-size:8px;margin-left:1px;opacity:.75}
  .dcol{position:relative;border-left:1px solid var(--line);cursor:cell;min-width:0}
  .dcol:last-of-type{border-right:1px solid var(--line)}
  .dcol.today{background:color-mix(in srgb,var(--ink) 2.5%,transparent)}
  .cell{position:absolute;left:0;right:0;border-top:1px solid var(--line);pointer-events:none}
  .cell.rest{background:var(--night)}
  .ev{position:absolute;padding:4px 8px 4px 9px;background:color-mix(in srgb,var(--c) 11%,var(--paper));
    font-size:12px;line-height:1.35;overflow:hidden;cursor:pointer;transition:background .2s;z-index:2}
  .ev::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--c)}
  .ev.m{background:color-mix(in srgb,var(--ink) 7%,var(--paper))}
  .ev.m::before{background:linear-gradient(var(--shu),var(--ai))}
  .ev strong{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ev small{display:block;color:var(--mute);font-size:10.5px;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
  .ev .d{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--c);margin:0 4px 1px 0}
  .ev .d + .d, .ev small .d:not(:first-child){margin-left:6px}
  .ev:hover,.ev.link{background:color-mix(in srgb,var(--c) 22%,var(--paper))}
  .ev.m:hover,.ev.m.link{background:color-mix(in srgb,var(--ink) 15%,var(--paper))}
  .now{position:absolute;left:-1px;right:0;height:1px;background:var(--ink);z-index:3;pointer-events:none}
  .now::before{content:"";position:absolute;left:-3px;top:-3px;width:7px;height:7px;border-radius:50%;background:var(--ink)}
  .foot{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:22px;align-items:center}
  .hint{margin:20px 0 0;color:var(--mute);font-size:12.5px;letter-spacing:.05em;max-width:66ch}

  dialog{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:2px;padding:0;width:min(520px,calc(100vw - 32px))}
  dialog::backdrop{background:color-mix(in srgb,var(--paper) 70%,transparent);backdrop-filter:blur(3px)}
  .dlg{padding:30px 30px 26px;display:flex;flex-direction:column;gap:22px}
  .dlg h3{margin:0;font:400 22px var(--serif);letter-spacing:.14em}
  #title{width:100%;font-size:17px;font-family:var(--serif)}
  .zone{display:flex;flex-direction:column;gap:8px}
  .row{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
  .row span{color:var(--mute)}
  .actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:4px}
  .actions div{display:flex;gap:18px;align-items:center}
  button.danger:hover{color:var(--shu);border-bottom-color:var(--shu)}
  .toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 18px;border-radius:2px;font-size:13px;letter-spacing:.06em;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;z-index:20}
  .toast.show{opacity:1}
  @media (max-width:760px){
    body{padding-block-start:32px}
    h1{font-size:36px}
    .clocks{grid-template-columns:1fr}
    .clock + .clock{padding-left:0;border-left:0;border-top:1px solid var(--line)}
    .dial{width:132px;height:132px}
    .dtime{font-size:28px}
  }
  @media (prefers-reduced-motion:reduce){ .ev,.toast{transition:none} }
</style>

<main class="page">
  <header class="head">
    <div>
      <h1>時差</h1>
      <p class="en">Jisa · Vietnam and Sweden on one schedule</p>
    </div>
    <div class="diff"><b id="diffN">6</b>時間</div>
  </header>

  <section class="clocks" aria-label="Current time">
    <div class="clock vn">
      <svg class="dial" id="dialVN" viewBox="0 0 200 200" role="img" aria-label="Analogue clock, Vietnam"></svg>
      <div class="ctext">
        <div class="label"><i></i>ベトナム · Ho Chi Minh City</div>
        <div class="dtime" id="clkVN">--:--</div>
        <div class="date" id="dtVN"></div>
      </div>
    </div>
    <div class="clock se">
      <svg class="dial" id="dialSE" viewBox="0 0 200 200" role="img" aria-label="Analogue clock, Sweden"></svg>
      <div class="ctext">
        <div class="label"><i></i>スウェーデン · Stockholm</div>
        <div class="dtime" id="clkSE">--:--</div>
        <div class="date" id="dtSE"></div>
      </div>
    </div>
  </section>

  <div class="tools">
    <div class="grp">
      <button id="prev" aria-label="Previous week">←</button>
      <input type="date" id="day" aria-label="Jump to a date">
      <button id="next" aria-label="Next week">→</button>
      <button id="today">今週 This week</button>
    </div>
    <div class="grp" role="group" aria-label="View">
      <button data-view="merged">合 Merged</button>
      <button data-view="split">分 Split</button>
    </div>
    <div class="grp" id="baseGrp" role="group" aria-label="Days follow">
      <span class="mini">Days follow</span>
      <button data-base="VN">Vietnam</button>
      <button data-base="SE">Sweden</button>
    </div>
    <span class="sp"></span>
    <button class="solid" id="add">+ New event</button>
  </div>

  <div class="cal-head">
    <h2 id="range"></h2>
    <div class="legend" id="legend"></div>
  </div>
  <div id="cal"></div>

  <div class="foot">
    <button id="share">Copy link</button>
    <button id="export">Export</button>
    <button id="import">Import</button>
    <input type="file" id="file" accept="application/json" hidden>
  </div>
  <p class="hint" id="hint"></p>
</main>

<dialog id="dlg">
  <form method="dialog" class="dlg" id="form">
    <h3 id="dlgTitle">予定</h3>
    <input type="text" id="title" placeholder="Title, e.g. Video call" aria-label="Title">
    <div class="zone vn">
      <div class="label"><i></i>ベトナム · Vietnam</div>
      <div class="row"><input type="date" id="vnDate" aria-label="Vietnam date"><input type="time" id="vnStart" aria-label="Vietnam start"><span>–</span><input type="time" id="vnEnd" aria-label="Vietnam end"></div>
    </div>
    <div class="zone se">
      <div class="label"><i></i>スウェーデン · Sweden</div>
      <div class="row"><input type="date" id="seDate" aria-label="Sweden date"><input type="time" id="seStart" aria-label="Sweden start"><span>–</span><input type="time" id="seEnd" aria-label="Sweden end"></div>
    </div>
    <div class="actions">
      <button type="button" class="danger" id="del">Delete</button>
      <div><button type="button" id="cancel">Cancel</button><button type="button" class="solid" id="save">Save</button></div>
    </div>
  </form>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script>
const VN = 'Asia/Ho_Chi_Minh', SE = 'Europe/Stockholm';
const $ = id => document.getElementById(id);
const KEY = 'jisa-schedule-v1', PKEY = 'jisa-prefs-v1';
const cls = tz => tz === VN ? 'vn' : 'se';
const tag = tz => tz === VN ? 'VN' : 'SE';
const name = tz => tz === VN ? 'Vietnam' : 'Sweden';
const jname = tz => tz === VN ? 'ベトナム' : 'スウェーデン';

/* ---------- time helpers (DST-safe, via Intl) ---------- */
function parts(ms, tz){
  const f = new Intl.DateTimeFormat('en-CA',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const o = {}; f.formatToParts(ms).forEach(p => o[p.type] = p.value); return o;
}
function offset(ms, tz){
  const p = parts(ms, tz);
  return Date.UTC(p.year, p.month-1, p.day, p.hour, p.minute, p.second) - Math.floor(ms/1000)*1000;
}
function zonedToUtc(date, time, tz){
  const [y,m,d] = date.split('-').map(Number), [h,mi] = time.split(':').map(Number);
  const guess = Date.UTC(y, m-1, d, h, mi);
  let t = guess - offset(guess, tz);
  t = guess - offset(t, tz);
  return t;
}
const fmtDate = (ms,tz) => { const p = parts(ms,tz); return `${p.year}-${p.month}-${p.day}`; };
const fmtTime = (ms,tz) => { const p = parts(ms,tz); return `${p.hour}:${p.minute}`; };
function addDays(date, n){ const [y,m,d] = date.split('-').map(Number); return new Date(Date.UTC(y,m-1,d+n)).toISOString().slice(0,10); }
function weekStartOf(date){ const [y,m,d] = date.split('-').map(Number); const dow = new Date(Date.UTC(y,m-1,d)).getUTCDay(); return addDays(date, -((dow+6)%7)); }
const uid = () => Math.random().toString(36).slice(2,9);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- state ---------- */
let events = [];
let prefs = {view:'merged', base:VN};
let day = fmtDate(Date.now(), VN);
let editing = null;

function load(){
  try{ const p = JSON.parse(localStorage.getItem(PKEY)); if(p && (p.view==='merged'||p.view==='split') && (p.base===VN||p.base===SE)) prefs = p; }catch(e){}
  try{
    if(location.hash.startsWith('#d=')){
      events = JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(3)))));
      save(); history.replaceState(null,'',location.pathname); return;
    }
    events = JSON.parse(localStorage.getItem(KEY)) || null;
  }catch(e){ events = null; }
  if(!events){
    // Examples: his lunch break (11:00-12:00 Sweden = 17:00-18:00 Vietnam) and a Sunday evening call
    events = [
      {id:uid(), title:'お昼 Lunch call', start:zonedToUtc(day,'11:00',SE), end:zonedToUtc(day,'12:00',SE)},
      {id:uid(), title:'Evening chat', start:zonedToUtc(addDays(day,2),'20:00',VN), end:zonedToUtc(addDays(day,2),'21:00',VN)}
    ];
  }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(events)); }catch(e){} }
function savePrefs(){ try{ localStorage.setItem(PKEY, JSON.stringify(prefs)); }catch(e){} }

/* ---------- analogue clocks ---------- */
const CX = 100, CY = 100;
function buildDial(svg){
  let s = '<circle class="face" cx="100" cy="100" r="94"/><circle class="ring" cx="100" cy="100" r="94"/>';
  for(let i=0;i<60;i++){
    const major = i%5===0;
    s += `<line class="${major?'th':'tm'}" x1="100" y1="${major?10:10}" x2="100" y2="${major?20:13}" transform="rotate(${i*6} 100 100)"/>`;
  }
  s += '<g class="arcs"></g>';
  s += '<text x="100" y="45" font-size="12">十二</text><text x="155" y="100" font-size="12">三</text><text x="100" y="155" font-size="12">六</text><text x="45" y="100" font-size="12">九</text>';
  s += '<text class="ampm" x="100" y="128" font-size="8.5" letter-spacing="2"></text>';
  s += '<line class="hh" x1="100" y1="100" x2="100" y2="58"/><line class="mm" x1="100" y1="100" x2="100" y2="32"/>';
  s += '<line class="ss" x1="100" y1="114" x2="100" y2="18"/><circle class="hub" cx="100" cy="100" r="3.6"/><circle class="hub2" cx="100" cy="100" r="1.8"/>';
  svg.innerHTML = s;
}
const rot = (el, deg) => el.setAttribute('transform', `rotate(${deg} 100 100)`);
const dialAngle = (ms, tz) => { const p = parts(ms,tz); return (((p.hour%12)*3600 + p.minute*60 + +p.second)/43200)*360; };
function arcPath(a0, len){
  const r = 70, rad = d => d*Math.PI/180;
  const pt = a => [CX + r*Math.sin(rad(a)), CY - r*Math.cos(rad(a))];
  if(len >= 359.5){ return `M ${CX} ${CY-r} A ${r} ${r} 0 1 1 ${CX} ${CY+r} A ${r} ${r} 0 1 1 ${CX} ${CY-r}`; }
  const [x0,y0] = pt(a0), [x1,y1] = pt(a0+len);
  return `M ${x0.toFixed(2)} ${y0.toFixed(2)} A ${r} ${r} 0 ${len>180?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}
function tickDial(svg, tz, now){
  const p = parts(now, tz), h = +p.hour, m = +p.minute, s = +p.second;
  rot(svg.querySelector('.hh'), ((h%12) + m/60 + s/3600)*30);
  rot(svg.querySelector('.mm'), (m + s/60)*6);
  rot(svg.querySelector('.ss'), s*6);
  svg.classList.toggle('night', h<7 || h>=19);
  svg.querySelector('.ampm').textContent = h<12 ? '午前' : '午後';
  // events in the next 12 hours drawn as arcs on the dial
  const arcs = events.filter(e => e.end > now && e.start < now+43200000).map(e => {
    const st = Math.max(e.start, now), en = Math.min(e.end, now+43200000);
    return `<path class="arc" d="${arcPath(dialAngle(st,tz), (en-st)/43200000*360)}"/>`;
  }).join('');
  const g = svg.querySelector('.arcs'); if(g.innerHTML !== arcs) g.innerHTML = arcs;
}

/* ---------- calendar ---------- */
function shortRange(e, tz){
  const f = ms => { const t = fmtTime(ms,tz); return t.endsWith(':00') ? t.slice(0,2) : t; };
  return `${f(e.start)}–${f(e.end)}`;
}
function layoutLanes(list){
  list.sort((a,b) => a.s - b.s);
  let cluster = [], end = 0;
  const flush = () => { if(!cluster.length) return; const n = Math.max(...cluster.map(c => c.lane))+1; cluster.forEach(c => c.n = n); cluster = []; };
  list.forEach(o => {
    if(cluster.length && o.s >= end) flush();
    if(!cluster.length) end = 0;
    const used = cluster.filter(c => c.t > o.s).map(c => c.lane);
    let l = 0; while(used.includes(l)) l++;
    o.lane = l; cluster.push(o); end = Math.max(end, o.t);
  });
  flush();
}
function buildWeek(base, other, HPX){
  const ws = weekStartOf(day), merged = !!other;
  const dates = [...Array(7)].map((_,i) => addDays(ws,i));
  const todayStr = fmtDate(Date.now(), base);
  const wk = document.createElement('div');
  wk.className = 'wk';
  wk.style.setProperty('--cols', merged ? '38px repeat(7,minmax(0,1fr)) 38px' : '38px repeat(7,minmax(0,1fr))');

  // header
  let head = `<div class="tag ${cls(base)}">${tag(base)}</div>`;
  dates.forEach(d => {
    const t = new Date(zonedToUtc(d,'12:00',base));
    const en = t.toLocaleDateString('en-GB',{timeZone:base,weekday:'short'});
    const ja = t.toLocaleDateString('ja-JP',{timeZone:base,weekday:'short'});
    head += `<div class="dh${d===todayStr?' today':''}"><b>${+d.slice(8)}</b><span>${en} ${ja}</span></div>`;
  });
  if(merged) head += `<div class="tag r ${cls(other)}">${tag(other)}</div>`;
  const hd = document.createElement('div'); hd.className = 'wkhead'; hd.innerHTML = head; wk.appendChild(hd);

  // body
  const body = document.createElement('div'); body.className = 'wkbody';
  const H = 24*HPX;
  const axis = (tz, side) => {
    const a = document.createElement('div'); a.className = `axis ${side} ${cls(tz)}`; a.style.height = H+'px';
    for(let h=0; h<24; h++){
      const hh = String(h).padStart(2,'0');
      const sp = document.createElement('span'); sp.style.top = (h*HPX-6)+'px';
      if(tz === base){ sp.textContent = hh; }
      else {
        const t = zonedToUtc(ws, hh+':00', base);
        const dd = Math.round((Date.parse(fmtDate(t,tz)) - Date.parse(ws))/864e5);
        sp.innerHTML = fmtTime(t,tz).slice(0,2) + (dd ? `<sup>${dd>0?'+':'−'}${Math.abs(dd)}</sup>` : '');
      }
      a.appendChild(sp);
    }
    return a;
  };
  body.appendChild(axis(base,'l'));

  dates.forEach(d => {
    const col = document.createElement('div');
    col.className = 'dcol' + (d===todayStr ? ' today' : '');
    col.style.height = H+'px';
    for(let h=0; h<24; h++){
      let rest;
      if(merged){
        const t = zonedToUtc(d, String(h).padStart(2,'0')+':00', base);
        const oh = +fmtTime(t,other).slice(0,2);
        rest = !(h>=7 && h<23 && oh>=7 && oh<23);
      } else rest = h<7 || h>=23;
      const c = document.createElement('div'); c.className = 'cell' + (rest?' rest':''); c.style.top = (h*HPX)+'px'; c.style.height = HPX+'px';
      col.appendChild(c);
    }
    const ds = zonedToUtc(d,'00:00',base), de = zonedToUtc(addDays(d,1),'00:00',base), span = de-ds;
    const list = events.filter(e => e.end > ds && e.start < de).map(e => ({e, s:Math.max(e.start,ds), t:Math.min(e.end,de)}));
    layoutLanes(list);
    list.forEach(o => {
      const e = o.e, div = document.createElement('div');
      div.className = `ev ${merged ? 'm' : cls(base)}`; div.dataset.id = e.id; div.tabIndex = 0;
      div.style.top = ((o.s-ds)/span*H)+'px';
      div.style.height = Math.max(24,(o.t-o.s)/span*H - 2)+'px';
      div.style.left = `calc(${o.lane/o.n*100}% + 3px)`;
      div.style.width = `calc(${100/o.n}% - 7px)`;
      const times = merged
        ? `<span class="${cls(base)}"><i class="d"></i>${shortRange(e,base)}</span> <span class="${cls(other)}"><i class="d"></i>${shortRange(e,other)}</span>`
        : `${fmtTime(e.start,base)} – ${fmtTime(e.end,base)}`;
      div.innerHTML = `<strong>${esc(e.title||'Untitled')}</strong><small>${times}</small>`;
      div.onclick = ev => { ev.stopPropagation(); openEditor(e); };
      div.onkeydown = ev => { if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); openEditor(e); } };
      col.appendChild(div);
    });
    const now = Date.now();
    if(now>=ds && now<de){ const n = document.createElement('div'); n.className = 'now'; n.style.top = ((now-ds)/span*H)+'px'; col.appendChild(n); }
    col.onclick = ev => {
      if(ev.target.closest('.ev')) return;
      const y = ev.clientY - col.getBoundingClientRect().top;
      const hour = Math.max(0,Math.min(23,Math.floor(y/HPX)));
      const st = zonedToUtc(d, String(hour).padStart(2,'0')+':00', base);
      openEditor({id:null,title:'',start:st,end:st+3600000});
    };
    body.appendChild(col);
  });
  if(merged) body.appendChild(axis(other,'r'));
  wk.appendChild(body);
  const sc = document.createElement('div'); sc.className = 'scroller'; sc.appendChild(wk);
  return sc;
}
// hovering an event lights up the same event everywhere else
document.addEventListener('mouseover', e => {
  const ev = e.target.closest && e.target.closest('.ev');
  document.querySelectorAll('.ev.link').forEach(n => n.classList.remove('link'));
  if(ev) document.querySelectorAll(`.ev[data-id="${ev.dataset.id}"]`).forEach(n => n.classList.add('link'));
});

function niceDay(d, tz){
  const t = new Date(zonedToUtc(d,'12:00',tz));
  const en = t.toLocaleDateString('en-GB',{timeZone:tz,weekday:'short',day:'numeric',month:'short'});
  const ja = t.toLocaleDateString('ja-JP',{timeZone:tz,month:'numeric',day:'numeric',weekday:'short'});
  return `${en} · ${ja}`;
}
function rangeLabel(){
  const ws = weekStartOf(day), we = addDays(ws,6);
  const f = (d,o) => new Date(d+'T12:00:00Z').toLocaleDateString('en-GB',Object.assign({timeZone:'UTC'},o));
  const a = f(ws,{day:'numeric',month:'short'}), b = f(we,{day:'numeric',month:'short',year:'numeric'});
  return `${a} – ${b}`;
}
function render(){
  $('day').value = day;
  $('range').innerHTML = rangeLabel() + `<span>${new Date(weekStartOf(day)+'T12:00:00Z').toLocaleDateString('ja-JP',{timeZone:'UTC',month:'long'})}</span>`;
  document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('on', b.dataset.view===prefs.view));
  document.querySelectorAll('[data-base]').forEach(b => b.classList.toggle('on', b.dataset.base===(prefs.base===VN?'VN':'SE')));
  $('baseGrp').hidden = prefs.view !== 'merged';
  const host = $('cal'); host.innerHTML = '';
  const base = prefs.base, other = base===VN ? SE : VN;
  if(prefs.view === 'merged'){
    host.appendChild(buildWeek(base, other, 30));
    $('legend').innerHTML = `<span class="${cls(base)}"><i></i>${jname(base)} ${name(base)}, left</span><span class="${cls(other)}"><i></i>${jname(other)} ${name(other)}, right</span>`;
    $('hint').textContent = `Unshaded hours are when you are both awake (07:00 to 23:00 on each side). The left scale follows ${name(base)}, the right scale shows ${name(other)}, and a small +1 or −1 marks the next or previous day there. Click an empty hour to add an event, or click an event to edit it. Events stay in this browser.`;
  } else {
    [VN,SE].forEach(tz => {
      const t = document.createElement('div'); t.className = `label zonetitle ${cls(tz)}`; t.innerHTML = `<i></i>${jname(tz)} · ${name(tz)}`;
      host.appendChild(t); host.appendChild(buildWeek(tz, null, 24));
    });
    $('legend').innerHTML = '';
    $('hint').textContent = 'Each country has its own week. An event appears in both at its own local time; hover one to see the other light up. Shaded hours are night (23:00 to 07:00). Events stay in this browser.';
  }
}
function tick(){
  const n = Date.now();
  [[VN,'VN'],[SE,'SE']].forEach(([tz,k]) => {
    $('clk'+k).textContent = fmtTime(n,tz);
    $('dt'+k).textContent = niceDay(fmtDate(n,tz),tz);
    tickDial($('dial'+k), tz, n);
  });
  $('diffN').textContent = (offset(n,VN)-offset(n,SE))/3600000;
}

/* ---------- editor (two-way linked) ---------- */
function setFrom(tz, prefix, e){
  $(prefix+'Date').value = fmtDate(e.start,tz);
  $(prefix+'Start').value = fmtTime(e.start,tz);
  $(prefix+'End').value = fmtTime(e.end,tz);
}
function openEditor(e){
  editing = {...e};
  $('dlgTitle').textContent = e.id ? '予定を編集' : '新しい予定';
  $('title').value = e.title;
  setFrom(VN,'vn',e); setFrom(SE,'se',e);
  $('del').hidden = !e.id;
  $('dlg').showModal();
}
function readZone(tz, prefix){
  const d = $(prefix+'Date').value, s = $(prefix+'Start').value, en = $(prefix+'End').value;
  if(!d||!s||!en) return null;
  const start = zonedToUtc(d,s,tz);
  let end = zonedToUtc(d,en,tz);
  if(end <= start) end = zonedToUtc(addDays(d,1),en,tz); // crosses midnight
  return {start,end};
}
function syncFrom(tz, prefix, otherTz, otherPrefix){
  const r = readZone(tz,prefix); if(!r) return;
  editing.start = r.start; editing.end = r.end;
  setFrom(otherTz, otherPrefix, editing);
}
['vnDate','vnStart','vnEnd'].forEach(id => $(id).addEventListener('input', () => syncFrom(VN,'vn',SE,'se')));
['seDate','seStart','seEnd'].forEach(id => $(id).addEventListener('input', () => syncFrom(SE,'se',VN,'vn')));
$('save').onclick = () => {
  editing.title = $('title').value.trim() || 'Untitled';
  if(editing.id){ events = events.map(e => e.id===editing.id ? editing : e); }
  else { editing.id = uid(); events.push(editing); }
  save(); $('dlg').close(); render(); tick();
  toast('Saved. Both schedules updated.');
};
$('del').onclick = () => { events = events.filter(e => e.id!==editing.id); save(); $('dlg').close(); render(); tick(); };
$('cancel').onclick = () => $('dlg').close();

/* ---------- toolbar ---------- */
$('day').onchange = e => { if(e.target.value){ day = e.target.value; render(); } };
$('prev').onclick = () => { day = addDays(day,-7); render(); };
$('next').onclick = () => { day = addDays(day,7); render(); };
$('today').onclick = () => { day = fmtDate(Date.now(),prefs.base); render(); };
$('add').onclick = () => { const st = zonedToUtc(day,'17:00',VN); openEditor({id:null,title:'',start:st,end:st+3600000}); };
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => { prefs.view = b.dataset.view; savePrefs(); render(); });
document.querySelectorAll('[data-base]').forEach(b => b.onclick = () => { prefs.base = b.dataset.base==='VN' ? VN : SE; savePrefs(); render(); });
$('share').onclick = () => {
  const url = location.origin + location.pathname + '#d=' + btoa(unescape(encodeURIComponent(JSON.stringify(events))));
  (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(()=>toast('Link copied. Send it to him.'), ()=>toast('Copy is blocked here. Use Export instead.'));
};
$('export').onclick = () => {
  try{
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(events,null,2)],{type:'application/json'}));
    a.download = 'schedule.json'; a.click();
  }catch(e){ toast('Export is not available here.'); }
};
$('import').onclick = () => $('file').click();
$('file').onchange = async e => {
  try{ const data = JSON.parse(await e.target.files[0].text()); if(Array.isArray(data)){ events = data; save(); render(); tick(); toast('Imported'); } }
  catch(err){ toast('That file could not be read.'); }
};
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2400); }

load(); buildDial($('dialVN')); buildDial($('dialSE')); render(); tick();
setInterval(tick,1000); setInterval(render,60000);
</script>
